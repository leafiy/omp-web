name: Self-hosted checks

# Deliberately manual: pushing this private version does not install, build,
# publish, or deploy anything automatically.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run Typecheck
        run: npx tsc --noEmit --incremental false

      - name: Check terminal sources
        run: npx eslint components/TerminalPanel.tsx components/TerminalViewport.tsx lib/terminal-*.ts lib/terminal-*.test.mjs app/api/terminal/

      - name: Terminal tests (including real PTY)
        run: npm run test:terminal
